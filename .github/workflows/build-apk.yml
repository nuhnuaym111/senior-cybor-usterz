name: Build SENIOR CYBOR Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'senior-cybor-project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract SENIOR CYBOR project archive
        run: |
          unzip -q senior-cybor-project.zip -d /tmp/senior-cybor
          cp -R /tmp/senior-cybor/senior-cybor/. .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SENIOR-CYBOR-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error 
